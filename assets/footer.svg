<?xml version="1.0" encoding="UTF-8"?>
<!--
  ElectroIoT - Animated Footer Wave
  Three parallax neon wave layers + drifting particles + a horizon glow line.
  Pure SMIL, no JavaScript. Designed to sit flush at the bottom of the README.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 220" width="1200" height="220"
     role="img" aria-label="ElectroIoT animated neon footer wave">
  <title>ElectroIoT - footer</title>

  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050816" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#050816" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0066FF" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#00C8FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00FFD5" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FFD5" stop-opacity="0.32"/>
      <stop offset="50%"  stop-color="#0066FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0066FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="hLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00FFD5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="fGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- One period of the wave is 600 units wide; the path repeats twice so a
         -600 translate loops seamlessly. -->
    <path id="wavePath"
          d="M0 60
             c 75 -34, 225 -34, 300 0 s 225 34, 300 0
             s 225 -34, 300 0 s 225 34, 300 0
             s 225 -34, 300 0 s 225 34, 300 0
             V 220 H 0 Z"/>
  </defs>

  <rect width="1200" height="220" fill="url(#fBg)"/>

  <!-- Horizon glow -->
  <rect x="0" y="46" width="1200" height="1.6" fill="url(#hLine)" filter="url(#fGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Back wave (slow) -->
  <g transform="translate(0 26)" opacity="0.45">
    <use href="#wavePath" xlink:href="#wavePath" fill="url(#waveB)">
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-600 0" dur="18s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Mid wave -->
  <g transform="translate(0 54)" opacity="0.6">
    <use href="#wavePath" xlink:href="#wavePath" fill="url(#waveA)">
      <animateTransform attributeName="transform" type="translate"
                        from="-600 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Front wave (fast, opaque) -->
  <g transform="translate(0 84)">
    <use href="#wavePath" xlink:href="#wavePath" fill="url(#waveC)" opacity="0.92">
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-600 0" dur="8s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Neon crest outline riding the front wave -->
  <g transform="translate(0 84)" fill="none" stroke="#00C8FF" stroke-width="2" filter="url(#fGlow)" opacity="0.85">
    <path d="M0 60 c 75 -34, 225 -34, 300 0 s 225 34, 300 0 s 225 -34, 300 0 s 225 34, 300 0
             s 225 -34, 300 0 s 225 34, 300 0">
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-600 0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Rising sparks -->
  <g fill="#00FFD5" filter="url(#fGlow)">
    <circle cx="180" cy="150" r="1.8">
      <animate attributeName="cy" values="150;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="170" r="1.5">
      <animate attributeName="cy" values="170;70" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="160" r="2">
      <animate attributeName="cy" values="160;56" dur="6.8s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="6.8s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="176" r="1.6">
      <animate attributeName="cy" values="176;74" dur="8s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="156" r="1.4">
      <animate attributeName="cy" values="156;64" dur="7s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="7s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Signature -->
  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="12" font-weight="600" letter-spacing="5" fill="#00C8FF" opacity="0.7">
    ELECTROIOT &#183; ENGINEERED WITH PRECISION
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
