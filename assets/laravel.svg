<?xml version="1.0" encoding="UTF-8"?>
<!--
  ElectroIoT - Laravel / Backend Illustration
  Request lifecycle: route -> middleware -> controller -> Eloquent -> database,
  with an animated request packet and a live artisan console.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280"
     role="img" aria-label="Laravel backend architecture illustration">
  <title>Laravel &#183; PHP &#183; Eloquent &#183; Queues &#183; APIs</title>

  <defs>
    <linearGradient id="lvCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lvEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>
    <linearGradient id="lvNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f2145"/>
      <stop offset="100%" stop-color="#0b1730"/>
    </linearGradient>
    <filter id="lvGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="436" height="276" rx="18" fill="url(#lvCard)"
        stroke="url(#lvEdge)" stroke-width="1.6"/>
  <rect x="2" y="2" width="436" height="276" rx="18" fill="none"
        stroke="#0066FF" stroke-opacity="0.18" stroke-width="6" filter="url(#lvGlow)"/>

  <!-- Laravel mark (stylised "V" of the official logomark, neon-tinted) -->
  <g transform="translate(360 34) scale(1.5)" filter="url(#lvGlow)">
    <path d="M0 0 L11 19 L22 0 L16.5 0 L11 9.5 L5.5 0 Z" fill="#00C8FF"/>
    <path d="M11 19 L22 0 L27.5 0 L16.5 19 Z" fill="#0066FF" opacity="0.85"/>
  </g>

  <text x="24" y="42" font-family="'Segoe UI',system-ui,sans-serif" font-size="18"
        font-weight="800" fill="#EAF6FF">Laravel <tspan fill="#00C8FF">Backend</tspan></text>
  <text x="24" y="62" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        font-weight="600" letter-spacing="1.8" fill="#00C8FF" opacity="0.75">
    REST APIs &#183; QUEUES &#183; EVENTS &#183; ELOQUENT
  </text>

  <!-- Pipeline rail -->
  <path id="lvRail" d="M50 122 H130 M170 122 H250 M290 122 H370" stroke="#00C8FF"
        stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Pipeline stages -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700"
     letter-spacing="1" text-anchor="middle">
    <g transform="translate(14 100)">
      <rect width="72" height="44" rx="10" fill="url(#lvNode)" stroke="#00C8FF" stroke-opacity="0.55"/>
      <path d="M22 22 h28 M40 14 l10 8 -10 8" stroke="#00FFD5" stroke-width="1.6" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="58" fill="#00C8FF" opacity="0.75">ROUTE</text>
    </g>
    <g transform="translate(134 100)">
      <rect width="72" height="44" rx="10" fill="url(#lvNode)" stroke="#00C8FF" stroke-opacity="0.55"/>
      <rect x="24" y="14" width="24" height="16" rx="3" fill="none" stroke="#00FFD5" stroke-width="1.6"/>
      <path d="M30 14 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#00FFD5" stroke-width="1.6"/>
      <text x="36" y="58" fill="#00C8FF" opacity="0.75">MIDDLEWARE</text>
    </g>
    <g transform="translate(254 100)">
      <rect width="72" height="44" rx="10" fill="url(#lvNode)" stroke="#00C8FF" stroke-opacity="0.55"/>
      <path d="M24 16 l-8 6 8 6 M48 16 l8 6 -8 6" fill="none" stroke="#00FFD5" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="58" fill="#00C8FF" opacity="0.75">CONTROLLER</text>
    </g>
    <g transform="translate(354 100)">
      <rect width="72" height="44" rx="10" fill="url(#lvNode)" stroke="#00FFD5" stroke-opacity="0.7"/>
      <g fill="none" stroke="#00FFD5" stroke-width="1.6">
        <ellipse cx="36" cy="15" rx="14" ry="5"/>
        <path d="M22 15 v12 a14 5 0 0 0 28 0 V15"/>
        <path d="M22 21 a14 5 0 0 0 28 0"/>
      </g>
      <text x="36" y="58" fill="#00FFD5" opacity="0.85">ELOQUENT</text>
    </g>
  </g>

  <!-- Request packet traversing the pipeline -->
  <g filter="url(#lvGlow)">
    <rect x="-5" y="-3" width="10" height="6" rx="3" fill="#00FFD5">
      <animateMotion path="M50 122 H370" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Queue workers -->
  <g transform="translate(24 178)">
    <text x="0" y="0" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5"
          font-weight="700" letter-spacing="1.4" fill="#00C8FF" opacity="0.7">QUEUE WORKERS</text>
    <g>
      <rect x="0"  y="8" width="34" height="12" rx="6" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.4"/>
      <rect x="0"  y="8" width="34" height="12" rx="6" fill="#00FFD5" opacity="0.25">
        <animate attributeName="opacity" values="0.05;0.4;0.05" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="40" y="8" width="34" height="12" rx="6" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.4"/>
      <rect x="40" y="8" width="34" height="12" rx="6" fill="#00FFD5" opacity="0.25">
        <animate attributeName="opacity" values="0.05;0.4;0.05" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="80" y="8" width="34" height="12" rx="6" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.4"/>
      <rect x="80" y="8" width="34" height="12" rx="6" fill="#00FFD5" opacity="0.25">
        <animate attributeName="opacity" values="0.05;0.4;0.05" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- Artisan console -->
  <g transform="translate(160 168)">
    <rect x="0" y="0" width="256" height="84" rx="10" fill="#050816" fill-opacity="0.85"
          stroke="#00C8FF" stroke-opacity="0.28"/>
    <g fill="#0066FF" opacity="0.8">
      <circle cx="14" cy="14" r="3.2"/><circle cx="26" cy="14" r="3.2"/><circle cx="38" cy="14" r="3.2"/>
    </g>
    <g font-family="'Consolas',monospace" font-size="9">
      <text x="14" y="36" fill="#00FFD5">$ php artisan queue:work --tries=3</text>
      <text x="14" y="52" fill="#00C8FF" opacity="0.75">[ok] SyncInverterTelemetry ... 42ms
        <animate attributeName="opacity" values="0;0.85;0.85" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="14" y="68" fill="#00C8FF" opacity="0.6">[ok] PublishMqttState ....... 18ms
        <animate attributeName="opacity" values="0;0;0.7;0.7" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="212" y="60" width="6" height="10" fill="#00FFD5">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
