<?xml version="1.0" encoding="UTF-8"?>
<!-- ElectroIoT card - AI Automation -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150"
     role="img" aria-label="AI Automation card">
  <title>AI Automation - predictive control and LLM workflows</title>
  <defs>
    <linearGradient id="aia-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="aia-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF"/><stop offset="100%" stop-color="#00FFD5"/>
    </linearGradient>
    <linearGradient id="aia-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C8FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aia-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="aia-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="aia-clip"><rect x="2" y="2" width="376" height="146" rx="16"/></clipPath>
  </defs>

  <rect x="2" y="2" width="376" height="146" rx="16" fill="url(#aia-bg)" stroke="url(#aia-edge)" stroke-width="1.5"/>
  <rect x="2" y="2" width="376" height="146" rx="16" fill="none" stroke="#0066FF"
        stroke-opacity="0.18" stroke-width="6" filter="url(#aia-glow)"/>

  <g clip-path="url(#aia-clip)">
    <rect x="-140" y="0" width="120" height="150" fill="url(#aia-sheen)">
      <animate attributeName="x" values="-140;400" dur="6s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="56" r="46" fill="url(#aia-halo)"/>
  </g>

  <g transform="translate(26 30)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0b1730" stroke="#0066FF" stroke-opacity="0.65"/>
    <g stroke="#00C8FF" stroke-opacity="0.6" stroke-width="1.2">
      <line x1="14" y1="18" x2="26" y2="12"/><line x1="14" y1="18" x2="26" y2="26"/>
      <line x1="14" y1="34" x2="26" y2="26"/><line x1="14" y1="34" x2="26" y2="40"/>
      <line x1="26" y1="12" x2="38" y2="26"/><line x1="26" y1="26" x2="38" y2="26"/>
      <line x1="26" y1="40" x2="38" y2="26"/>
    </g>
    <g fill="#00FFD5">
      <circle cx="14" cy="18" r="2.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="14" cy="34" r="2.6"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="26" cy="12" r="2.6"/><circle cx="26" cy="26" r="2.6"/><circle cx="26" cy="40" r="2.6"/>
      <circle cx="38" cy="26" r="3.4" filter="url(#aia-glow)">
        <animate attributeName="r" values="3;4.4;3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <text x="96" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="17"
        font-weight="800" fill="#EAF6FF">AI Automation</text>
  <text x="96" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">Forecast-driven load shifting, anomaly detection</text>
  <text x="96" y="83" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">and LLM assistants wired into real devices.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">
    <rect x="96"  y="98" width="56" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="124" y="110" text-anchor="middle" fill="#00C8FF">PYTHON</text>
    <rect x="158" y="98" width="44" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="180" y="110" text-anchor="middle" fill="#00C8FF">LLM</text>
    <rect x="208" y="98" width="76" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="246" y="110" text-anchor="middle" fill="#00C8FF">FORECASTING</text>
  </g>

  <rect x="26" y="128" width="0" height="2.5" rx="1.25" fill="url(#aia-edge)" filter="url(#aia-glow)">
    <animate attributeName="width" values="0;326;326;0" keyTimes="0;0.4;0.8;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
