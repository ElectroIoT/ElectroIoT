<?xml version="1.0" encoding="UTF-8"?>
<!-- ElectroIoT card - Laravel CRM -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150"
     role="img" aria-label="Laravel CRM card">
  <title>Laravel CRM - multi-tenant business platform</title>
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="lc-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8FF"/><stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="lc-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C8FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lc-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lc-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lc-clip"><rect x="2" y="2" width="376" height="146" rx="16"/></clipPath>
  </defs>

  <rect x="2" y="2" width="376" height="146" rx="16" fill="url(#lc-bg)" stroke="url(#lc-edge)" stroke-width="1.5"/>
  <rect x="2" y="2" width="376" height="146" rx="16" fill="none" stroke="#00C8FF"
        stroke-opacity="0.16" stroke-width="6" filter="url(#lc-glow)"/>

  <g clip-path="url(#lc-clip)">
    <rect x="-140" y="0" width="120" height="150" fill="url(#lc-sheen)">
      <animate attributeName="x" values="-140;400" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="56" r="46" fill="url(#lc-halo)"/>
  </g>

  <g transform="translate(26 30)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.55"/>
    <g fill="none" stroke="#00C8FF" stroke-width="1.6" stroke-linejoin="round">
      <path d="M26 10 L42 18 L26 26 L10 18 Z"/>
      <path d="M10 26 L26 34 L42 26"/>
      <path d="M10 34 L26 42 L42 34"/>
    </g>
    <path d="M10 26 L26 34 L42 26" stroke="#00FFD5" stroke-width="1.6" fill="none" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="96" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="17"
        font-weight="800" fill="#EAF6FF">Laravel CRM</text>
  <text x="96" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">Multi-tenant CRM with roles, billing, audit trails</text>
  <text x="96" y="83" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">and a fully typed REST API.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">
    <rect x="96"  y="98" width="56" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="124" y="110" text-anchor="middle" fill="#00C8FF">LARAVEL</text>
    <rect x="158" y="98" width="56" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="186" y="110" text-anchor="middle" fill="#00C8FF">MYSQL</text>
    <rect x="220" y="98" width="66" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="253" y="110" text-anchor="middle" fill="#00C8FF">TAILWIND</text>
  </g>

  <rect x="26" y="128" width="0" height="2.5" rx="1.25" fill="url(#lc-edge)" filter="url(#lc-glow)">
    <animate attributeName="width" values="0;326;326;0" keyTimes="0;0.4;0.8;1" dur="5s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
