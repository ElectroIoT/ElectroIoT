<?xml version="1.0" encoding="UTF-8"?>
<!-- ElectroIoT card - MQTT -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150"
     role="img" aria-label="MQTT card">
  <title>MQTT - message broker backbone</title>
  <defs>
    <linearGradient id="mq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="mq-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8FF"/><stop offset="100%" stop-color="#00FFD5"/>
    </linearGradient>
    <linearGradient id="mq-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C8FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mq-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="mq-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mq-clip"><rect x="2" y="2" width="376" height="146" rx="16"/></clipPath>
  </defs>

  <rect x="2" y="2" width="376" height="146" rx="16" fill="url(#mq-bg)" stroke="url(#mq-edge)" stroke-width="1.5"/>
  <rect x="2" y="2" width="376" height="146" rx="16" fill="none" stroke="#00C8FF"
        stroke-opacity="0.16" stroke-width="6" filter="url(#mq-glow)"/>

  <g clip-path="url(#mq-clip)">
    <rect x="-140" y="0" width="120" height="150" fill="url(#mq-sheen)">
      <animate attributeName="x" values="-140;400" dur="6s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="56" r="46" fill="url(#mq-halo)"/>
  </g>

  <g transform="translate(26 30)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.55"/>
    <circle cx="26" cy="34" r="3.6" fill="#00FFD5" filter="url(#mq-glow)"/>
    <g fill="none" stroke="#00C8FF" stroke-width="1.7" stroke-linecap="round">
      <path d="M18 30 a 11 11 0 0 1 16 0" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M13 24 a 19 19 0 0 1 26 0" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></path>
      <path d="M8 18 a 27 27 0 0 1 36 0" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <text x="96" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="17"
        font-weight="800" fill="#EAF6FF">MQTT</text>
  <text x="96" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">Topic design, retained state, QoS tuning and TLS</text>
  <text x="96" y="83" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">hardened brokers for fleets of devices.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">
    <rect x="96"  y="98" width="70" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="131" y="110" text-anchor="middle" fill="#00C8FF">MOSQUITTO</text>
    <rect x="172" y="98" width="46" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="195" y="110" text-anchor="middle" fill="#00C8FF">TLS</text>
    <rect x="224" y="98" width="60" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="254" y="110" text-anchor="middle" fill="#00C8FF">QoS 0-2</text>
  </g>

  <rect x="26" y="128" width="0" height="2.5" rx="1.25" fill="url(#mq-edge)" filter="url(#mq-glow)">
    <animate attributeName="width" values="0;326;326;0" keyTimes="0;0.4;0.8;1" dur="5s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
