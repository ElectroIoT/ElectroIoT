<?xml version="1.0" encoding="UTF-8"?>
<!-- ElectroIoT card - Linux -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150"
     role="img" aria-label="Linux card">
  <title>Linux - servers, edge hosts and shell tooling</title>
  <defs>
    <linearGradient id="lx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="lx-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFD5"/><stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="lx-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFD5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FFD5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00FFD5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lx-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFD5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00FFD5" stop-opacity="0"/>
    </radialGradient>
    <filter id="lx-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lx-clip"><rect x="2" y="2" width="376" height="146" rx="16"/></clipPath>
  </defs>

  <rect x="2" y="2" width="376" height="146" rx="16" fill="url(#lx-bg)" stroke="url(#lx-edge)" stroke-width="1.5"/>
  <rect x="2" y="2" width="376" height="146" rx="16" fill="none" stroke="#00FFD5"
        stroke-opacity="0.16" stroke-width="6" filter="url(#lx-glow)"/>

  <g clip-path="url(#lx-clip)">
    <rect x="-140" y="0" width="120" height="150" fill="url(#lx-sheen)">
      <animate attributeName="x" values="-140;400" dur="6s" begin="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="56" r="46" fill="url(#lx-halo)"/>
  </g>

  <g transform="translate(26 30)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0b1730" stroke="#00FFD5" stroke-opacity="0.55"/>
    <rect x="9" y="13" width="34" height="26" rx="4" fill="#050816" stroke="#00C8FF" stroke-opacity="0.6"/>
    <path d="M14 22 l5 4 -5 4" fill="none" stroke="#00FFD5" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="23" y1="31" x2="34" y2="31" stroke="#00C8FF" stroke-width="1.7" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="96" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="17"
        font-weight="800" fill="#EAF6FF">Linux</text>
  <text x="96" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">Hardened Debian/Ubuntu hosts, systemd services,</text>
  <text x="96" y="83" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">nginx, and reproducible provisioning.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">
    <rect x="96"  y="98" width="58" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="125" y="110" text-anchor="middle" fill="#00C8FF">SYSTEMD</text>
    <rect x="160" y="98" width="52" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="186" y="110" text-anchor="middle" fill="#00C8FF">NGINX</text>
    <rect x="218" y="98" width="52" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="244" y="110" text-anchor="middle" fill="#00C8FF">BASH</text>
  </g>

  <rect x="26" y="128" width="0" height="2.5" rx="1.25" fill="url(#lx-edge)" filter="url(#lx-glow)">
    <animate attributeName="width" values="0;326;326;0" keyTimes="0;0.4;0.8;1" dur="5s" begin="4s" repeatCount="indefinite"/>
  </rect>
</svg>
