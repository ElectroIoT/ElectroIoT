<?xml version="1.0" encoding="UTF-8"?>
<!-- ElectroIoT card - Home Assistant -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150"
     role="img" aria-label="Home Assistant card">
  <title>Home Assistant - smart home orchestration</title>
  <defs>
    <linearGradient id="ha-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="ha-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8FF"/><stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="ha-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C8FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ha-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ha-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ha-clip"><rect x="2" y="2" width="376" height="146" rx="16"/></clipPath>
  </defs>

  <rect x="2" y="2" width="376" height="146" rx="16" fill="url(#ha-bg)" stroke="url(#ha-edge)" stroke-width="1.5"/>
  <rect x="2" y="2" width="376" height="146" rx="16" fill="none" stroke="#00C8FF"
        stroke-opacity="0.16" stroke-width="6" filter="url(#ha-glow)"/>

  <g clip-path="url(#ha-clip)">
    <rect x="-140" y="0" width="120" height="150" fill="url(#ha-sheen)">
      <animate attributeName="x" values="-140;400" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="56" r="46" fill="url(#ha-halo)"/>
  </g>

  <g transform="translate(26 30)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.55"/>
    <g transform="translate(10 11)" stroke="#00C8FF" stroke-width="1.7" fill="none" stroke-linejoin="round">
      <path d="M16 2 L31 15 v15 H1 V15 Z"/>
      <path d="M12 30 v-9 h8 v9"/>
    </g>
    <circle cx="26" cy="30" r="2.6" fill="#00FFD5" filter="url(#ha-glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="96" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="17"
        font-weight="800" fill="#EAF6FF">Home Assistant</text>
  <text x="96" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">Custom integrations, Lovelace dashboards and</text>
  <text x="96" y="83" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">energy-aware automation blueprints.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">
    <rect x="96"  y="98" width="60" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="126" y="110" text-anchor="middle" fill="#00C8FF">ESPHOME</text>
    <rect x="162" y="98" width="50" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="187" y="110" text-anchor="middle" fill="#00C8FF">YAML</text>
    <rect x="218" y="98" width="60" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="248" y="110" text-anchor="middle" fill="#00C8FF">HACS</text>
  </g>

  <rect x="26" y="128" width="0" height="2.5" rx="1.25" fill="url(#ha-edge)" filter="url(#ha-glow)">
    <animate attributeName="width" values="0;326;326;0" keyTimes="0;0.4;0.8;1" dur="5s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
</svg>
