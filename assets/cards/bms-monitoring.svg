<?xml version="1.0" encoding="UTF-8"?>
<!-- ElectroIoT card - BMS Monitoring -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150"
     role="img" aria-label="BMS Monitoring card">
  <title>BMS Monitoring - battery telemetry and cell balancing</title>
  <defs>
    <linearGradient id="bms-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="bms-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFD5"/><stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>
    <linearGradient id="bms-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFD5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FFD5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00FFD5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bms-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFD5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00FFD5" stop-opacity="0"/>
    </radialGradient>
    <filter id="bms-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bms-clip"><rect x="2" y="2" width="376" height="146" rx="16"/></clipPath>
  </defs>

  <rect x="2" y="2" width="376" height="146" rx="16" fill="url(#bms-bg)" stroke="url(#bms-edge)" stroke-width="1.5"/>
  <rect x="2" y="2" width="376" height="146" rx="16" fill="none" stroke="#00FFD5"
        stroke-opacity="0.16" stroke-width="6" filter="url(#bms-glow)"/>

  <g clip-path="url(#bms-clip)">
    <rect x="-140" y="0" width="120" height="150" fill="url(#bms-sheen)">
      <animate attributeName="x" values="-140;400" dur="6s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="52" cy="56" r="46" fill="url(#bms-halo)"/>
  </g>

  <g transform="translate(26 30)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0b1730" stroke="#00FFD5" stroke-opacity="0.55"/>
    <rect x="10" y="16" width="30" height="20" rx="4" fill="none" stroke="#00C8FF" stroke-width="1.6"/>
    <rect x="40" y="22" width="4" height="8" rx="1.5" fill="#00C8FF"/>
    <rect x="13" y="19" width="7" height="14" rx="2" fill="#00FFD5"/>
    <rect x="22" y="19" width="7" height="14" rx="2" fill="#00FFD5" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="31" y="19" width="6" height="14" rx="2" fill="#00C8FF" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="96" y="46" font-family="'Segoe UI',system-ui,sans-serif" font-size="17"
        font-weight="800" fill="#EAF6FF">BMS Monitoring</text>
  <text x="96" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">Per-cell voltages, temperature, SoC/SoH tracking</text>
  <text x="96" y="83" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        fill="#00C8FF" opacity="0.85">and balance-fault alerting.</text>

  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">
    <rect x="96"  y="98" width="60" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="126" y="110" text-anchor="middle" fill="#00C8FF">LiFePO4</text>
    <rect x="162" y="98" width="52" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="188" y="110" text-anchor="middle" fill="#00C8FF">CAN</text>
    <rect x="220" y="98" width="66" height="18" rx="9" fill="#0066FF" fill-opacity="0.18" stroke="#00C8FF" stroke-opacity="0.4"/>
    <text x="253" y="110" text-anchor="middle" fill="#00C8FF">GRAFANA</text>
  </g>

  <rect x="26" y="128" width="0" height="2.5" rx="1.25" fill="url(#bms-edge)" filter="url(#bms-glow)">
    <animate attributeName="width" values="0;326;326;0" keyTimes="0;0.4;0.8;1" dur="5s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
