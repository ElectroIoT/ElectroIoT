<?xml version="1.0" encoding="UTF-8"?>
<!--
  ElectroIoT - IoT Illustration
  ESP32 gateway publishing to an MQTT broker, fanning out to smart-home devices.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280"
     role="img" aria-label="Internet of Things and smart home illustration">
  <title>IoT &#183; ESP32 &#183; MQTT &#183; Home Assistant</title>

  <defs>
    <linearGradient id="iCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="iEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <radialGradient id="iHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00C8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="iGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="436" height="276" rx="18" fill="url(#iCard)"
        stroke="url(#iEdge)" stroke-width="1.6"/>
  <rect x="2" y="2" width="436" height="276" rx="18" fill="none"
        stroke="#00C8FF" stroke-opacity="0.18" stroke-width="6" filter="url(#iGlow)"/>

  <text x="24" y="42" font-family="'Segoe UI',system-ui,sans-serif" font-size="18"
        font-weight="800" fill="#EAF6FF">IoT <tspan fill="#00C8FF">Ecosystem</tspan></text>
  <text x="24" y="62" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5"
        font-weight="600" letter-spacing="1.8" fill="#00C8FF" opacity="0.75">
    ESP32 &#183; MQTT &#183; ESPHOME &#183; HOME ASSISTANT
  </text>

  <!-- Central gateway halo -->
  <circle cx="220" cy="160" r="92" fill="url(#iHalo)">
    <animate attributeName="r" values="82;98;82" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Broadcast rings -->
  <g fill="none" stroke="#00FFD5" stroke-width="1.4">
    <circle cx="220" cy="160" r="34" opacity="0">
      <animate attributeName="r" values="30;92" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="160" r="34" opacity="0">
      <animate attributeName="r" values="30;92" dur="3.4s" begin="1.13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3.4s" begin="1.13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="160" r="34" opacity="0">
      <animate attributeName="r" values="30;92" dur="3.4s" begin="2.26s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="3.4s" begin="2.26s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Links to devices -->
  <g stroke="#0066FF" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="220" y1="160" x2="76"  y2="112"/>
    <line x1="220" y1="160" x2="72"  y2="218"/>
    <line x1="220" y1="160" x2="366" y2="106"/>
    <line x1="220" y1="160" x2="372" y2="214"/>
    <line x1="220" y1="160" x2="220" y2="244"/>
  </g>

  <!-- MQTT payload packets -->
  <g fill="#00FFD5" filter="url(#iGlow)">
    <circle r="2.4"><animateMotion path="M220 160 L76 112" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle r="2.4"><animateMotion path="M220 160 L366 106" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="2.4"><animateMotion path="M372 214 L220 160" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle r="2.4"><animateMotion path="M72 218 L220 160" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ESP32 gateway board -->
  <g transform="translate(186 130)">
    <g fill="#00C8FF" opacity="0.8">
      <rect x="-7" y="8"  width="7" height="3" rx="1"/><rect x="-7" y="20" width="7" height="3" rx="1"/>
      <rect x="-7" y="32" width="7" height="3" rx="1"/><rect x="-7" y="44" width="7" height="3" rx="1"/>
      <rect x="68" y="8"  width="7" height="3" rx="1"/><rect x="68" y="20" width="7" height="3" rx="1"/>
      <rect x="68" y="32" width="7" height="3" rx="1"/><rect x="68" y="44" width="7" height="3" rx="1"/>
    </g>
    <rect x="0" y="0" width="68" height="58" rx="7" fill="#0b1730" stroke="#00C8FF" stroke-width="1.6"/>
    <rect x="7" y="8" width="26" height="22" rx="3" fill="#0f2145" stroke="#00C8FF" stroke-opacity="0.55"/>
    <rect x="39" y="12" width="22" height="22" rx="3" fill="#08122b" stroke="#00FFD5" stroke-opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="42" y="27" font-family="'Consolas',monospace" font-size="7.5" font-weight="700" fill="#00FFD5">32</text>
    <rect x="7" y="38" width="54" height="12" rx="3" fill="#050816" stroke="#0066FF" stroke-opacity="0.5"/>
    <text x="34" y="47" text-anchor="middle" font-family="'Consolas',monospace" font-size="7"
          fill="#00C8FF" opacity="0.85">GATEWAY</text>
  </g>

  <!-- Device: sensor -->
  <g transform="translate(46 92)">
    <rect x="0" y="0" width="52" height="40" rx="8" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.6"/>
    <circle cx="16" cy="20" r="7" fill="none" stroke="#00FFD5" stroke-width="1.6"/>
    <path d="M16 15 v10 M11 20 h10" stroke="#00FFD5" stroke-width="1.4"/>
    <text x="34" y="17" text-anchor="middle" font-family="'Consolas',monospace" font-size="7" fill="#00C8FF">TEMP</text>
    <text x="34" y="28" text-anchor="middle" font-family="'Consolas',monospace" font-size="8" fill="#00FFD5">27.4</text>
  </g>

  <!-- Device: relay / switch -->
  <g transform="translate(42 198)">
    <rect x="0" y="0" width="52" height="40" rx="8" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.6"/>
    <rect x="10" y="13" width="32" height="14" rx="7" fill="#050816" stroke="#00FFD5" stroke-opacity="0.7"/>
    <circle cx="18" cy="20" r="5" fill="#00FFD5">
      <animate attributeName="cx" values="18;34;34;18;18" keyTimes="0;0.25;0.5;0.75;1" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Device: smart lamp -->
  <g transform="translate(342 84)">
    <rect x="0" y="0" width="52" height="40" rx="8" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.6"/>
    <circle cx="26" cy="19" r="9" fill="#00FFD5" opacity="0.35" filter="url(#iGlow)">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M22 26 h8 M23 30 h6" stroke="#00C8FF" stroke-width="1.4"/>
  </g>

  <!-- Device: energy meter -->
  <g transform="translate(348 192)">
    <rect x="0" y="0" width="52" height="40" rx="8" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.6"/>
    <polyline points="8,30 16,22 24,26 32,14 44,20" fill="none" stroke="#00FFD5" stroke-width="1.8"
              stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0;0;60" dur="5s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- Device: Home Assistant hub -->
  <g transform="translate(194 236)">
    <rect x="0" y="0" width="52" height="34" rx="8" fill="#0b1730" stroke="#00C8FF" stroke-opacity="0.6"/>
    <path d="M26 8 L38 18 v9 H14 v-9 Z" fill="none" stroke="#00FFD5" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="26" cy="21" r="2.4" fill="#00FFD5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Topic strip -->
  <text x="24" y="86" font-family="'Consolas',monospace" font-size="9" fill="#00FFD5" opacity="0.75">
    topic: home/energy/#
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.6s" repeatCount="indefinite"/>
  </text>
</svg>
